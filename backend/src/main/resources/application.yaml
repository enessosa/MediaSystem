spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediasystem}
    username: ${DB_USERNAME:mediasystem}
    password: ${DB_PASSWORD:mediasystem}

  jpa:
    hibernate:
      # Schema wird ausschließlich über Flyway verwaltet, nicht von Hibernate.
      # 'validate' stellt sicher, dass Entities zum Schema passen (schlägt bei Drift fehl).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
services:
  postgres:
    image: postgres:17-alpine
    container_name: mediasystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediasystem}
      POSTGRES_USER: ${POSTGRES_USER:-mediasystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediasystem}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediasystem} -d ${POSTGRES_DB:-mediasystem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mediasystem-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mediasystem}
      DB_USERNAME: ${POSTGRES_USER:-mediasystem}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mediasystem}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mediasystem-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8580}:80"

volumes:
  postgres_data: